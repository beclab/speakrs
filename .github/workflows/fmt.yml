name: Fmt

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
  # beclab-master too, or this fork's own pull requests run nothing. Why, and why the line
  # had to reach the base branch before it could switch itself on, is written out once beside
  # the same trigger in ci.yml rather than twice.
  pull_request:
    branches:
      - master
      - beclab-master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run ruff format
        run: uvx ruff format --check scripts fixtures
