name: Fmt

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
  # 🔴 beclab-master too, or this fork's own pull requests run nothing. Every branch here
  # targets beclab-master -- master is kept as a mirror of upstream -- so a trigger listing
  # only master left #1 with zero checks while its reviews called the tests green on the
  # strength of one laptop.
  #
  # Split out of that branch and sent here first on purpose: GitHub reads the trigger from the
  # workflow on the BASE branch, so the fix cannot switch itself on from inside the pull
  # request that carries it.
  pull_request:
    branches:
      - master
      - beclab-master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run ruff format
        run: uvx ruff format --check scripts fixtures
